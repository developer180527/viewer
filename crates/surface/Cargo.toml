[package]
name = "viewer-surface"
description = "libviewer's views on a GPU surface: the fonts, the GPU host and the page views both shells draw with, and a canvas for a surface another UI owns (the SwiftUI shell's Metal view)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libfileparser-core = { workspace = true, features = ["mmap", "scene"] }
libviewer.workspace = true
viewer-model.workspace = true
viewer-core.workspace = true
viewer-formats.workspace = true
anyhow.workspace = true
rendererx = { workspace = true, features = ["controls"] }
# Pinned with the app's (crates/app/Cargo.toml says why).
libgui = { git = "https://github.com/developer180527/libgui.git", rev = "017ac12d7a54a0f2c82ad1d146d79737efc88471" }
libgui_keymap = { git = "https://github.com/developer180527/libgui.git", rev = "017ac12d7a54a0f2c82ad1d146d79737efc88471" }
libgui_wgpu = { git = "https://github.com/developer180527/libgui.git", rev = "017ac12d7a54a0f2c82ad1d146d79737efc88471" }
libgui_sysfonts = { git = "https://github.com/developer180527/libgui.git", rev = "017ac12d7a54a0f2c82ad1d146d79737efc88471" }
wgpu = { version = "30" }
pollster = { version = "1" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
