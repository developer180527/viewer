[package]
name = "viewer-ffi"
description = "viewer-core for Swift (and other languages UniFFI speaks): the session, its commands, and content by range, for the SwiftUI shell (docs/design/apple-ui.md §3)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# A static library for the xcframework; a dynamic one for uniffi-bindgen to read
# the interface from; the Rust one for tests.
crate-type = ["staticlib", "cdylib", "lib"]

[features]
# The `uniffi-bindgen` binary, which writes the Swift (scripts/apple.sh).
cli = ["uniffi/cli"]

[dependencies]
viewer-core.workspace = true
libviewer.workspace = true
viewer-model.workspace = true
libfileparser-core = { workspace = true, features = ["mmap", "scene"] }
uniffi = "0.32"
# The Metal view: libviewer drawn into the shell's layer, as the libgui app draws it.
viewer-surface.workspace = true
libgui = { git = "https://github.com/developer180527/libgui.git", rev = "d63d8365e91e855e3389234de3471514629604b9" }
anyhow.workspace = true

[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]
