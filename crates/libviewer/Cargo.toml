[package]
name = "libviewer"
description = "Views for libfileparser's content models (text, hex, tree, table, container, raster, scene), drawn with libgui: any app shows any facet of any file with them (docs/design/libviewer.md)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libfileparser-core = { workspace = true, features = ["scene"] }
# RendererX draws scenes; its orbit controls drive the 3D view's camera.
rendererx = { workspace = true, features = ["controls"] }
wgpu = { version = "30" }
# Pinned to the same commit as the app (libgui is pre-1.0).
libgui = { git = "https://github.com/developer180527/libgui.git", rev = "d63d8365e91e855e3389234de3471514629604b9" }
libgui_markdown = { git = "https://github.com/developer180527/libgui.git", rev = "d63d8365e91e855e3389234de3471514629604b9" }

[dev-dependencies]
# Golden renders of the views, drawn on the CPU as the app's screenshots are.
libgui_soft = { git = "https://github.com/developer180527/libgui.git", rev = "d63d8365e91e855e3389234de3471514629604b9" }
image = { version = "0.25", default-features = false, features = ["png"] }
