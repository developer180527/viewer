[package]
name = "libfileparser-docs"
description = "Any document into pages or formatted text: PDF (through MuPDF, with the `mupdf` feature), XPS, DjVu, comics, e-books, office documents and slides, web pages, mail, and every plain-text markup, wiki and manual format (docs/design/libfileparser.md §2)."
version.workspace = true
edition.workspace = true
# MIT/Apache. The `mupdf` feature links libfileparser-mupdf, which is AGPL-3.0-or-later
# as MuPDF is: an app that turns it on takes on the AGPL (docs/design/pdf.md §3).
license.workspace = true

[features]
default = []
# PDF (and later XPS) through MuPDF, built from source. AGPL. Off by default: without
# it a PDF is recognised and refused with `ParseError::Unsupported`, and an app can
# register a PDF reader of its own (libfileparser-pdfkit on Apple platforms).
mupdf = ["dep:libfileparser-mupdf"]

[dependencies]
libfileparser-core.workspace = true
# Our own format libraries (docs/design/libfileparser.md §6), where no mature one was
# more reliable on the real-world corpus.
rtf-lite = { workspace = true, features = ["encodings"] }
docx-lite.workspace = true
odt-lite.workspace = true
markup-lite.workspace = true
xmldoc-lite.workspace = true
mobi-lite.workspace = true
# Markdown (CommonMark and GitHub's tables, strikethrough, task lists, footnotes).
pulldown-cmark = { version = "0.13", default-features = false }
# Comics' pages are images (a sideways use toward a leaf, docs/design/libfileparser.md §2).
libfileparser-images.workspace = true
# Zip-based documents (CBZ, DOCX, ODT, EPUB, XPS) and CBT; pure Rust.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4", default-features = false }
# CB7 and CBR comics: 7-Zip (with its BZip2, Deflate, PPMd and Zstd coders) and RAR
# 1.3 to 5, both pure Rust; measured on libarchive's 182 test archives first.
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "deflate", "ppmd", "zstd"] }
rars = { version = "0.13", default-features = false }
# HTML and XHTML (EPUB chapters): html5ever, Servo's HTML parser, through scraper's DOM.
scraper = { version = "0.29", default-features = false }
ego-tree = "0.11"
# A web page in the encoding it declares (`<meta charset>`).
encoding_rs = "0.8"
# PowerPoint (PPTX, PPT) and Word 97–2003 (DOC): measured on 1,013 real files first.
office_oxide = { version = "0.1.17", default-features = false }
# Markup (2026-11-18): reStructuredText, Djot, AsciiDoc, Typst's syntax.
rst_parser = "0.4"
# rst_parser's tree, walked as JSON (its own HTML writer leaves 13 elements unimplemented).
document_tree = "0.4"
serde_json = "1"
jotdown = "0.10"
asciidoc-parser = "0.31"
typst-syntax = "0.15"
# Base64 in notebooks' image outputs.
base64 = "0.22"
# Mail: RFC 5322 messages, mailboxes and web archives (Stalwart's parser), and
# Outlook's .msg.
mail-parser = { version = "1", default-features = false, features = ["full_encoding"] }
msg_parser = "0.3"
# Hangul Word Processor: HWP 3 and 5, and HWPX.
unhwp = { version = "0.24", default-features = false, features = ["hwp5", "hwpx", "hwp3"] }
# DjVu: scanned books and papers, as pages.
djvu-rs = { version = "0.46", default-features = false, features = ["std"] }
# EPUB 2 and 3: the container, package, spine, table of contents and resources.
rbook = { version = "0.7", default-features = false, features = ["threadsafe"] }
# Org: orgize's parse, through its HTML export.
orgize = "=0.10.0-alpha.10"

# MuPDF's Windows build isn't wired in yet (docs/design/pdf.md §10).
[target.'cfg(not(windows))'.dependencies]
libfileparser-mupdf = { workspace = true, optional = true }

[dev-dependencies]
libfileparser-testkit.workspace = true
