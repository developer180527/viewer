[package]
name = "libfileparser"
description = "Every libfileparser category together: detection across them, the best reading opened, and the generic Raw, Source and Package facets added (docs/design/libfileparser.md §8)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["images", "3d", "text", "archives"]
images = ["dep:libfileparser-images"]
3d = ["dep:libfileparser-3d"]
text = ["dep:libfileparser-text"]
archives = ["dep:libfileparser-archives"]

[dependencies]
libfileparser-core.workspace = true
libfileparser-images = { workspace = true, optional = true }
libfileparser-3d = { workspace = true, optional = true }
libfileparser-text = { workspace = true, optional = true }
libfileparser-archives = { workspace = true, optional = true }

[dev-dependencies]
libfileparser-testkit.workspace = true
scene-data.workspace = true
zip = { version = "9", default-features = false }
