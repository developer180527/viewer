[package]
name = "gltf-lite"
description = "A glTF 2.0 / GLB reader, zero-copy from the mapped file, into a scene-data scene. No GPU, no image decoding."
version.workspace = true
edition.workspace = true
license.workspace = true

# Depends on scene-data only, never rendererx or wgpu: it must run in a parser
# worker or sandbox before any GPU exists (docs/design/3d-renderer.md §2).
[dependencies]
scene-data.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
rendererx = { workspace = true, features = ["controls"] }
wgpu = "30"
pollster = "1"
serde_json = "1"
bytemuck = "1"
base64 = "0.22"
