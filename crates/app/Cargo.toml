[package]
name = "viewer"
description = "Open any file. The app shell: window, navigation and renderers."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "viewer"
path = "src/main.rs"

[dependencies]
viewer-core.workspace = true
viewer-fmt-image.workspace = true
viewer-fmt-doc.workspace = true
viewer-fmt-data.workspace = true
viewer-fmt-archive.workspace = true
viewer-fmt-3d.workspace = true
anyhow.workspace = true
rfd = "0.17"
# Only for writing --screenshot PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }



# libgui is pre-1.0 and expects to be pinned to a commit (its CHANGELOG.md lists
# what to change when moving the pin).
libgui = { git = "https://github.com/developer180527/libgui.git", rev = "ab3ded28ca9d015501fdc800ef85f9332356cc18" }
libgui_keymap = { git = "https://github.com/developer180527/libgui.git", rev = "ab3ded28ca9d015501fdc800ef85f9332356cc18" }
libgui_wgpu = { git = "https://github.com/developer180527/libgui.git", rev = "ab3ded28ca9d015501fdc800ef85f9332356cc18" }
libgui_winit = { git = "https://github.com/developer180527/libgui.git", rev = "ab3ded28ca9d015501fdc800ef85f9332356cc18" }
libgui_soft = { git = "https://github.com/developer180527/libgui.git", rev = "ab3ded28ca9d015501fdc800ef85f9332356cc18" }
libgui_sysfonts = { git = "https://github.com/developer180527/libgui.git", rev = "ab3ded28ca9d015501fdc800ef85f9332356cc18" }
libgui_markdown = { git = "https://github.com/developer180527/libgui.git", rev = "ab3ded28ca9d015501fdc800ef85f9332356cc18" }
wgpu = { version = "30" }
winit = { version = "0.30" }
pollster = { version = "1" }
rendererx = { workspace = true, features = ["controls"] }

[target.'cfg(unix)'.dependencies]
# mmap for the global allocator's big blocks (src/alloc.rs).
libc = "0.2"
