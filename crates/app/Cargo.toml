[package]
name = "viewer"
description = "Open any file. The app shell: window, navigation and renderers."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "viewer"
path = "src/main.rs"

[dependencies]
libfileparser-core.workspace = true
libviewer.workspace = true
viewer-core.workspace = true
viewer-fmt-doc.workspace = true
viewer-fmt-pdf.workspace = true
viewer-formats.workspace = true
libfilepicker.workspace = true
anyhow.workspace = true
# Only for writing --screenshot PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }



# libgui is pre-1.0 and expects to be pinned to a commit (its CHANGELOG.md lists
# what to change when moving the pin).
libgui = { git = "https://github.com/developer180527/libgui.git", rev = "2709ad469b741647a693c6b0e5aefe56620c20a4" }
libgui_keymap = { git = "https://github.com/developer180527/libgui.git", rev = "2709ad469b741647a693c6b0e5aefe56620c20a4" }
libgui_wgpu = { git = "https://github.com/developer180527/libgui.git", rev = "2709ad469b741647a693c6b0e5aefe56620c20a4" }
libgui_winit = { git = "https://github.com/developer180527/libgui.git", rev = "2709ad469b741647a693c6b0e5aefe56620c20a4" }
libgui_soft = { git = "https://github.com/developer180527/libgui.git", rev = "2709ad469b741647a693c6b0e5aefe56620c20a4" }
libgui_sysfonts = { git = "https://github.com/developer180527/libgui.git", rev = "2709ad469b741647a693c6b0e5aefe56620c20a4" }
libgui_markdown = { git = "https://github.com/developer180527/libgui.git", rev = "2709ad469b741647a693c6b0e5aefe56620c20a4" }
wgpu = { version = "30" }
winit = { version = "0.30" }
pollster = { version = "1" }
rendererx = { workspace = true, features = ["controls"] }

# Putting winit's window into a UIKit scene (lg/mod.rs, adopt_scene).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
# mmap for the global allocator's big blocks (src/alloc.rs).
libc = "0.2"
