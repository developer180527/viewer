[package]
name = "libfileparser-images"
description = "Any image into a document: PNG, JPEG, WebP, GIF, TIFF, BMP, PNM, EXR, HDR, DDS, QOI, ICO, TGA and SVG, decoded when shown, big ones band by band (docs/design/libfileparser.md §2)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libfileparser-core.workspace = true
# Pure-Rust decoders only, so this builds on every target.
# EXR files `image` refuses: one channel (a roughness map), or channels with other names.
exr = "1.74"
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "qoi", "pnm", "hdr", "exr", "dds", "ff", "rayon",
] }
# Row-by-row PNG decoding for big images (the version `image` uses).
png = "0.18"
# TIFFs `image` won't convert (1-, 4-, 12-, 32-bit, float, signed, palette, multiband),
# read here through the decoder it uses (tiff_any.rs).
tiff = "0.11"
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "svgz", "raster-images"] }

[dev-dependencies]
smallvec = "1"
libfileparser-testkit.workspace = true
