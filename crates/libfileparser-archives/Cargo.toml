[package]
name = "libfileparser-archives"
description = "Archives and folders as containers whose entries open as files: zip, tar (also gzipped), gzip, folders (docs/design/libfileparser.md §2)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libfileparser-core.workspace = true
# Pure-Rust codecs only; zstd and AES would pull in C or crypto deps.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"

[dev-dependencies]
libfileparser-testkit.workspace = true
