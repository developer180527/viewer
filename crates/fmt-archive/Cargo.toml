[package]
name = "viewer-fmt-archive"
description = "Containers: zip, tar, tar.gz, gz, and folders on disk."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
viewer-core.workspace = true
anyhow.workspace = true
# Pure-Rust codecs only; zstd and AES would pull in C or crypto deps.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
