[package]
name = "libfileparser-3d"
description = "Any 3D file into documents with facets: glTF/GLB/VRM, FBX, OBJ, STL, PLY, USD/USDZ, .blend previews (docs/design/libfileparser-3d.md)."
version.workspace = true
edition.workspace = true
license.workspace = true

# Readers build CPU scenes only (scene-data): no GPU, so they can move to a parser
# worker later (PLAN.md §12.4). Files, threads and progress go through libfileparser-core's hooks.
[dependencies]
libfileparser-core.workspace = true
anyhow.workspace = true
scene-data.workspace = true
gltf-lite.workspace = true
usd-lite.workspace = true
# The glTF facet's tree, keys in the file's order.
serde_json = { version = "1", features = ["preserve_order"] }
# Official bindings to ufbx, a single-file C loader for FBX (and OBJ/MTL).
ufbx = "0.11"
# Texture decoding; the same pure-Rust decoders libfileparser-images builds.
# JPEG decoded at 1/2–1/8 scale in the IDCT, so a 4K map never exists at full size.
jpeg-decoder = { version = "0.3", default-features = false }
# EXR read pixel by pixel, shrinking as it decodes (see textures.rs); the version `image` uses.
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga", "exr", "hdr"] }

[dev-dependencies]
libfileparser-testkit.workspace = true
base64 = "0.22"
