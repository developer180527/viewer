[package]
name = "libfileparser-data"
description = "Any data file written as text into a document: JSON and its dialects, YAML, TOML, XML, property lists, INI-like config and delimited tables, as trees and tables that link to their lines (docs/design/libfileparser.md §2.1)."
version.workspace = true
edition.workspace = true
license.workspace = true

# A feature per family (docs/design/libfileparser.md §2.1). Structured and delimited
# formats are always in.
[features]
default = ["config", "logs", "geo", "feeds", "l10n", "records", "sql", "schemas", "rdf", "graphs", "science", "business"]
config = []
logs = []
geo = ["dep:zip"]
feeds = []
l10n = []
records = []
sql = []
schemas = []
rdf = ["dep:oxttl", "dep:oxrdfxml", "dep:oxrdf"]
graphs = []
science = []
business = []

[dependencies]
libfileparser-core.workspace = true
memchr.workspace = true
csv = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "preserve_order"] }
saphyr-parser = "0.0.6"
quick-xml = "0.41"
plist = { version = "1", default-features = false }
# KMZ (feature `geo`): pure-Rust inflate only.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

# RDF (feature `rdf`): Oxigraph's parsers, pure Rust. Not on WASM: they need a source
# of randomness (`getrandom`) the browser target doesn't have without set-up.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxttl = { version = "0.2", optional = true }
oxrdfxml = { version = "0.2", optional = true }
oxrdf = { version = "0.3", optional = true }

[dev-dependencies]
libfileparser-testkit.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
