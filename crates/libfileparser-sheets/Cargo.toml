[package]
name = "libfileparser-sheets"
description = "Workbooks as tables, sheet by sheet, with their formulas: XLSX, XLSM, XLSB, XLS (and Excel 2–5), ODS, FODS, SYLK, DIF, XML Spreadsheet 2003 (docs/design/libfileparser.md §2)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libfileparser-core.workspace = true
# The mature reader of these formats. MIT.
calamine = { version = "0.38", features = ["dates"] }
# Checks made before calamine sees a file (guard.rs).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Our own crates: calamine failed on 46 of 399 real ODS files and reads no FODS.
ods-lite.workspace = true
sylk-lite.workspace = true
dif-lite.workspace = true
# Excel 2 to 5 saved without a compound file, and Excel 2003's XML: calamine reads neither.
biff-lite = { workspace = true, features = ["encodings"] }
xmlss-lite.workspace = true

[dev-dependencies]
libfileparser-testkit.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
