[package]
name = "libfileparser-text"
description = "Any text file into a document: text by lines with its language, and the Source facet the front door gives every text file (docs/design/libfileparser.md §2)."
version.workspace = true
edition.workspace = true
license.workspace = true

# Highlighting is the app's: this crate says what language a text is in, nothing more.
[dependencies]
libfileparser-core.workspace = true
memchr.workspace = true
# Text in other encodings (Windows code pages, ISO-8859, Shift_JIS, GB18030, UTF-16…):
# encoding_rs decodes, chardetng (Mozilla's, as Firefox uses) guesses which. MIT/Apache.
encoding_rs = "0.8"
chardetng = "0.1"

[dev-dependencies]
libfileparser-testkit.workspace = true
