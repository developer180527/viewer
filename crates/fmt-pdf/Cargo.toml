[package]
name = "viewer-fmt-pdf"
description = "PDF documents as pages: MuPDF everywhere but iOS, PDFKit on iOS (docs/design/pdf.md)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
viewer-core.workspace = true
anyhow.workspace = true

# MuPDF everywhere but iOS, where the App Store can't carry its AGPL; PDFKit on Apple
# platforms (the backend on iOS, selectable on macOS for comparison). docs/design/pdf.md §2–4.
[target.'cfg(not(target_os = "ios"))'.dependencies]
viewer-pdf-mupdf.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
viewer-pdf-pdfkit.workspace = true
