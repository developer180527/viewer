[package]
name = "viewer-fmt-3d"
description = "3D models: glTF/GLB, FBX and OBJ into RendererX scenes; .blend preview images."
version.workspace = true
edition.workspace = true
license.workspace = true

# Loaders build CPU scenes only (rendererx-scene): no GPU, so they can move to a parser
# worker later (PLAN.md §12.4).
[dependencies]
viewer-core.workspace = true
anyhow.workspace = true
rendererx-scene.workspace = true
rendererx-gltf.workspace = true
usd-lite.workspace = true
# Official bindings to ufbx, a single-file C loader for FBX (and OBJ/MTL).
ufbx = "0.11"
# Texture decoding; the same pure-Rust decoders viewer-fmt-image already builds.
# EXR read pixel by pixel, shrinking as it decodes (see textures.rs); the version `image` uses.
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga", "exr", "hdr"] }
