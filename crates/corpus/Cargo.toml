[package]
name = "viewer-corpus"
description = "The test corpus runner: opens every file in corpus/manifest.toml and checks what it opens as."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
viewer-core.workspace = true
libfileparser-core = { workspace = true, features = ["mmap", "scene"] }
viewer-formats.workspace = true
scene-data.workspace = true
anyhow.workspace = true
toml = { version = "1", default-features = false, features = ["parse", "display", "serde", "preserve_order"] }
image = { version = "0.25", default-features = false, features = ["png"] }
