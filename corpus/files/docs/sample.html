<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Viewer corpus page</title>
  <meta name="description" content="A web page for the test corpus: every block and mark the reader keeps.">
  <meta name="author" content="Viewer">
  <style>body { font-family: sans-serif; }</style>
  <script>document.title = "never run";</script>
</head>
<body>
  <header><nav><a href="#intro">Intro</a> · <a href="https://example.org/">Elsewhere</a></nav></header>
  <main>
    <h1 id="intro">A page</h1>
    <p>Some <em>emphasis</em>, <strong>strong</strong>, <code>code</code> and a <a href="other.html">link</a>.</p>
    <h2>Lists</h2>
    <ul><li>one</li><li>two<ol start="3"><li>three</li></ol></li></ul>
    <blockquote><p>A quotation.</p></blockquote>
    <pre><code>fn main() {}</code></pre>
    <table>
      <thead><tr><th>Name</th><th>Value</th></tr></thead>
      <tbody><tr><td>a</td><td>1</td></tr><tr><td>b</td><td>2</td></tr></tbody>
    </table>
    <figure><img src="pic.png" alt="A picture"><figcaption>Its caption.</figcaption></figure>
    <!-- a comment for the Elements tree -->
    <form><input type="text" name="q"><button>Search</button></form>
  </main>
  <footer><p>The end.</p></footer>
</body>
</html>
