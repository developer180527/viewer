# The SwiftUI shell for macOS (docs/design/apple-ui.md, build order step 2): native
# chrome around viewer-core, through viewer-ffi's Swift bindings. Build the library and
# bindings first, then generate and open the project:
#     scripts/apple.sh
#     xcodegen --spec apple/project.yml --project apple
# (apple/run-mac.sh does all three and launches it.)
name: ViewerShell
options:
  bundleIdPrefix: dev.venugopal
  deploymentTarget:
    macOS: "14.0"
targets:
  ViewerShell:
    type: application
    platform: macOS
    sources:
      - path: Shell
      # Generated by scripts/apple.sh from the library's own metadata.
      - path: ../target/apple/swift/ViewerFFI.swift
    dependencies:
      - framework: ../target/apple/ViewerFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.venugopal.viewer.shell
        PRODUCT_NAME: Viewer
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Viewer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Shell/Viewer.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        # The Rust library's system dependencies (rustc --print native-static-libs).
        OTHER_LDFLAGS: "-framework PDFKit -framework Foundation -framework CoreGraphics -framework CoreFoundation -lobjc -lc++ -liconv"
        DEAD_CODE_STRIPPING: YES
