# The SwiftUI shells (docs/design/apple-ui.md, build order steps 2 and 3): native chrome
# around viewer-core, through viewer-ffi's Swift bindings, and libviewer's renderers in a
# Metal view. Shared/ is both apps' (the session, the native lists); Mac/ and Mobile/
# are each platform's window, input and file access. Build the library and bindings
# first, then generate the project:
#     scripts/apple.sh            (all, for the iOS targets too)
#     xcodegen --spec apple/project.yml --project apple
# apple/run-mac.sh and apple/run-ios.sh do it all and launch the app.
name: ViewerShell
options:
  bundleIdPrefix: dev.venugopal
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settingGroups:
  common:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Viewer
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    PRODUCT_NAME: Viewer
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # The Rust library's system dependencies (rustc --print native-static-libs).
    OTHER_LDFLAGS: "-framework PDFKit -framework Foundation -framework CoreGraphics -framework CoreFoundation -lobjc -lc++ -liconv"
    DEAD_CODE_STRIPPING: YES
targets:
  ViewerShell:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Mac
      # Generated by scripts/apple.sh from the library's own metadata.
      - path: ../target/apple/swift/ViewerFFI.swift
    dependencies:
      - framework: ../target/apple/ViewerFFI.xcframework
        embed: false
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.venugopal.viewer.shell
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Mac/Viewer.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  ViewerMobile:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Mobile
      - path: ../target/apple/swift/ViewerFFI.swift
    dependencies:
      - framework: ../target/apple/ViewerFFI.xcframework
        embed: false
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.venugopal.viewer.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        # The simulator build is the arm64 one the xcframework has.
        ARCHS: arm64
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Files opens documents in place in Viewer ("Open in…", Share), reading them
        # where they are rather than copying them in.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        # An iPad trackpad or mouse clicks as a pointer, not a finger.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: Mobile/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item, public.folder]
