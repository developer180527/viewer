# CI (PLAN.md §7, §12.7): every push builds and tests on Linux, Windows and macOS,
# checks headless memory budgets, and builds the shared crates for Android and iOS.
#
# GPU tests run on software GPUs (hosted runners have no real one): lavapipe (Mesa's
# Vulkan) on Linux, WARP on Windows, the runner's virtual Metal device on macOS. They
# skip themselves when no adapter exists, so a missing driver shows as fewer tests,
# not a failure.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        # MuPDF builds from the third_party/mupdf submodule (docs/design/pdf.md §4).
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Linux packages (window system, file dialogs, software Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev mesa-vulkan-drivers libvulkan1

      # Warnings as errors.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      # What the golden screenshot test drew, and its diffs, when it fails.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: goldens-${{ matrix.os }}
          path: target/tmp/goldens/
          if-no-files-found: ignore

  memory:
    name: Memory budgets (Linux, headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        # MuPDF builds from the third_party/mupdf submodule (docs/design/pdf.md §4).
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            time libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev mesa-vulkan-drivers libvulkan1

      - name: Benchmark files
        run: python3 bench/make-samples.py --big

      # Headless only: no display here, and windowed numbers are too noisy on shared
      # runners to budget. Fails when a case is over bench/memory-budgets-linux.txt.
      - name: Measure and check
        run: MEMORY_HEADLESS_ONLY=1 bench/memory.sh --check | tee memory.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-linux
          path: memory.txt

  android:
    name: Build (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The shared crates (formats, renderer, USD); the app shell for Android comes
      # with its own frontend later (PLAN.md §5).
      # cargo-ndk finds the runner's NDK through ANDROID_NDK_ROOT.
      - name: Build
        run: >
          cargo ndk -t arm64-v8a build
          -p viewer-core -p viewer-fmt-doc -p libfileparser-data
          -p libfileparser -p libfileparser-core -p libfileparser-3d -p libfileparser-images -p libfileparser-text -p libfileparser-archives
          -p scene-data -p rendererx -p gltf-lite -p usd-lite -p libviewer

  # The libraries' public APIs (docs/design/libfileparser.md §5): each matches its
  # snapshot in crates/<crate>/api/, and no change breaks semver without a version
  # bump. A failing snapshot is a diff to review: an intended change is committed with
  # `scripts/api.sh --update`.
  api:
    name: Public API
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # The baseline commit for semver checks.
          fetch-depth: 0

      # cargo-public-api reads rustdoc's JSON, which needs nightly.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api,cargo-semver-checks

      - name: Snapshots
        run: scripts/api.sh

      - name: Semver
        run: |
          # Against the commit before this push on main, else where the branch left main.
          # A crate joins this list once it is on main.
          if [ "$GITHUB_REF" = refs/heads/main ]; then base=HEAD~1; else base=$(git merge-base HEAD origin/main); fi
          cargo semver-checks --baseline-rev "$base" \
            -p libfileparser-core -p libfileparser -p libfileparser-3d -p libfileparser-images -p libfileparser-text \
            -p libfileparser-archives -p libfileparser-data -p libfileparser-testkit -p usd-lite -p gltf-lite -p scene-data -p libviewer

  # The shared crates and the app itself (ios/run-sim.sh runs it on a simulator).
  ios:
    name: Build (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: >
          cargo build --target aarch64-apple-ios -p viewer
          -p viewer-core -p viewer-fmt-doc -p libfileparser-data
          -p libfileparser -p libfileparser-core -p libfileparser-3d -p libfileparser-images -p libfileparser-text -p libfileparser-archives
          -p scene-data -p rendererx -p gltf-lite -p usd-lite -p libviewer
