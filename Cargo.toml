[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
viewer-core = { path = "crates/core" }
viewer-fmt-image = { path = "crates/fmt-image" }
viewer-fmt-doc = { path = "crates/fmt-doc" }
viewer-fmt-data = { path = "crates/fmt-data" }
viewer-fmt-archive = { path = "crates/fmt-archive" }
viewer-fmt-3d = { path = "crates/fmt-3d" }
# Pre-1.0, pinned to a commit like libgui.
libfilepicker = { git = "https://github.com/developer180527/libfilepicker.git", rev = "98d36bf2418d205e9b1e40898175af975732a14c" }
rendererx-scene = { path = "crates/rendererx-scene" }
rendererx = { path = "crates/rendererx" }
rendererx-gltf = { path = "crates/rendererx-gltf" }
usd-lite = { path = "crates/usd-lite" }
viewer-pdf-mupdf = { path = "crates/pdf-mupdf" }
viewer-pdf-pdfkit = { path = "crates/pdf-pdfkit" }
viewer-fmt-pdf = { path = "crates/fmt-pdf" }

anyhow = "1"
memmap2 = "0.9"
memchr = "2"
infer = "0.22"

# Startup and size matter more than build time: see PLAN.md §7.
[profile.release]
lto = "fat"
codegen-units = 1
# No `panic = "abort"`: a panicking decoder must fall back to the next loader
# (see Registry::open), not take the window down.
strip = true

# Decoders are unusably slow unoptimised; keep our own crates debuggable.
[profile.dev.package."*"]
opt-level = 2

# TEMPORARY, do not commit: the local libfilepicker with `PickOptions` / `pick_with`.
# Once that is committed and pushed there, bump `rev` above and delete this block.
[patch."https://github.com/developer180527/libfilepicker.git"]
libfilepicker = { path = "../libfilepicker" }
