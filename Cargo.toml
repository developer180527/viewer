[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
viewer-core = { path = "crates/core" }
# Each crate names the features it needs (mmap, scene): a data-only or WASM build gets neither.
libfileparser-core = { path = "crates/libfileparser-core", default-features = false }
libfileparser-testkit = { path = "crates/libfileparser-testkit" }
viewer-fmt-doc = { path = "crates/fmt-doc" }
libfileparser-3d = { path = "crates/libfileparser-3d" }
libfileparser-text = { path = "crates/libfileparser-text" }
libfileparser-archives = { path = "crates/libfileparser-archives" }
libfileparser = { path = "crates/libfileparser" }
libfileparser-images = { path = "crates/libfileparser-images" }
libfileparser-data = { path = "crates/libfileparser-data" }
libviewer = { path = "crates/libviewer" }
viewer-formats = { path = "crates/formats" }
# Pre-1.0, pinned to a commit like libgui.
libfilepicker = { git = "https://github.com/developer180527/libfilepicker.git", rev = "b99e3cd990e50fdeb3e96a3a703dacf77f7c8c66" }
scene-data = { path = "crates/scene-data" }
rendererx = { path = "crates/rendererx" }
gltf-lite = { path = "crates/gltf-lite" }
usd-lite = { path = "crates/usd-lite" }
rtf-lite = { path = "crates/rtf-lite" }
docx-lite = { path = "crates/docx-lite" }
odt-lite = { path = "crates/odt-lite" }
libfileparser-mupdf = { path = "crates/libfileparser-mupdf" }
libfileparser-pdfkit = { path = "crates/libfileparser-pdfkit" }
libfileparser-docs = { path = "crates/libfileparser-docs" }

anyhow = "1"
memmap2 = "0.9"
memchr = "2"
infer = "0.22"

# Startup and size matter more than build time: see PLAN.md §7.
[profile.release]
lto = "fat"
codegen-units = 1
# No `panic = "abort"`: a panicking decoder must fall back to the next loader
# (see Registry::open), not take the window down.
strip = true

# Decoders are unusably slow unoptimised; keep our own crates debuggable.
[profile.dev.package."*"]
opt-level = 2
